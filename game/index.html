<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minkey — Banana Scramble</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="stage">
    <canvas id="game" width="960" height="540" aria-label="Minkey game canvas"></canvas>
    <footer class="controls-hint">
      <span><b>←/→</b> or <b>A/D</b> move</span>
      <span><b>Space</b>/<b>W</b>/<b>↑</b> jump (double-jump!)</span>
      <span><b>Enter</b> start / restart</span>
      <span><b>M</b> mute</span>
    </footer>
  </main>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
